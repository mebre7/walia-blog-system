{% extends "base.html" %}
{% load static %}

{% block title %}404 | Walia-blog{% endblock %}

{% block content %}
<main class="py-5 reveal">
  <div class="container py-5">
    <div class="soft-card rounded-5 p-5 text-center">
      <div class="mb-4">
        <img src="{% static 'images/page_not_found.png' %}" alt="Page not found" class="img-fluid rounded-4" style="max-width: 260px; opacity: 0.85; object-fit: cover;">
      </div>
      <span class="section-kicker">404</span>
      <h1 class="display-5 fw-bold mt-3 mb-3">Page not found</h1>
      <p class="text-muted-soft mb-4">The category you’re looking for doesn’t exist.</p>
      <a href="/" class="btn btn-brand rounded-pill px-4">Back home</a>
    </div>
  </div>
</main>
{% endblock %}
